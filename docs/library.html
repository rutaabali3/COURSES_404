<style>
:root{
  --bg:#faf9f7; --surface:#ffffff; --ink:#1c1b18; --muted:#6e6c64;
  --line:#e8e6e1; --line-strong:#d9d6ce;
  --accent:#0d6b4f; --accent-dark:#0a5740; --accent-soft:#eef4f0;
  --radius:8px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.container{max-width:1080px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.012em;line-height:1.15}
p{margin:0 0 1.1em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── header ─────────────────────────────────────────── */
.site-header{border-bottom:1px solid var(--line);background:var(--bg);
  position:sticky;top:0;z-index:20}
.header-inner{display:flex;align-items:center;justify-content:space-between;
  gap:20px;min-height:64px}
.brand{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink);
  letter-spacing:-.01em}
.brand:hover{text-decoration:none}
.brand em{font-style:normal;color:var(--accent)}
.site-nav{display:flex;align-items:center;gap:26px}
.site-nav a{color:var(--ink);font-size:14.5px;font-weight:500}
.site-nav a:hover{color:var(--accent);text-decoration:none}
.site-nav a.active{color:var(--accent)}
.site-nav a.nav-cta{border:1px solid var(--ink);border-radius:6px;padding:7px 14px;
  font-weight:600;transition:.15s}
.site-nav a.nav-cta:hover{background:var(--ink);color:#fff}
.nav-toggle{display:none;background:none;border:1px solid var(--line-strong);
  border-radius:6px;padding:8px 12px;font:600 13px var(--sans);color:var(--ink);
  cursor:pointer}
@media(max-width:760px){
  .nav-toggle{display:block}
  .site-nav{display:none;position:absolute;top:64px;left:0;right:0;
    background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;
    align-items:flex-start;gap:0;padding:8px 24px 16px}
  .site-nav a{padding:10px 0;width:100%;border-top:1px solid var(--line)}
  .site-nav a.nav-cta{border:0;padding:10px 0;width:100%}
  .site-nav.open{display:flex}
}

/* ── buttons ────────────────────────────────────────── */
.btn{display:inline-block;padding:12px 24px;border-radius:6px;border:1px solid var(--ink);
  font:600 15px var(--sans);cursor:pointer;text-decoration:none;transition:.15s;
  letter-spacing:.01em}
.btn:hover{text-decoration:none}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#000}
.btn-outline{background:transparent;color:var(--ink)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 14px;font-size:13.5px}

/* ── hero / sections ───────────────────────────────── */
.hero{padding-top:88px;padding-bottom:64px}
.eyebrow{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin:0 0 14px}
.hero h1{font-size:clamp(38px,5.6vw,60px);margin:0 0 22px;max-width:16ch}
.hero .lead{font-size:19px;color:var(--muted);max-width:58ch;margin:0 0 34px}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap}
.section{border-top:1px solid var(--line);padding:68px 0}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.section-head .no{font-family:var(--serif);font-style:italic;color:var(--muted);
  font-size:15px;min-width:28px}
.section-head h2{font-size:clamp(26px,3.4vw,32px);margin:0}
.section-sub{color:var(--muted);max-width:62ch;margin:0 0 36px}

/* ── cards ──────────────────────────────────────────── */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 26px 22px;display:flex;flex-direction:column;gap:10px;
  transition:border-color .15s}
.card:hover{border-color:var(--line-strong)}
.card h3{font-size:21px;margin:0}
.card p{color:var(--muted);font-size:15px;margin:0}
.card .meta{margin-top:auto;padding-top:16px;display:flex;gap:14px;flex-wrap:wrap;
  font:500 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .meta b{color:var(--accent);font-weight:600}

/* course detail card */
.course-card{grid-column:1/-1;display:grid;gap:28px;
  grid-template-columns:1.4fr 1fr}
@media(max-width:820px){.course-card{grid-template-columns:1fr}}
.course-card ul{margin:14px 0 0;padding:0;list-style:none}
.course-card ul li{padding:9px 0 9px 26px;border-top:1px solid var(--line);
  font-size:15px;position:relative}
.course-card ul li::before{content:"";position:absolute;left:2px;top:16px;width:10px;
  height:10px;border:2px solid var(--accent);border-radius:50%}

/* ── steps ──────────────────────────────────────────── */
.steps{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  counter-reset:step}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px}
.step::before{counter-increment:step;content:counter(step,decimal-leading-zero);
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--accent)}
.step h3{font-size:18px;margin:10px 0 6px}
.step p{color:var(--muted);font-size:14.5px;margin:0}

/* ── CTA band / footer ──────────────────────────────── */
.cta-band{border-top:1px solid var(--line);background:var(--accent-soft);padding:64px 0}
.cta-band h2{font-size:clamp(26px,3.4vw,34px);margin:0 0 12px}
.cta-band p{color:var(--muted);max-width:56ch;margin:0 0 26px}
.site-footer{border-top:1px solid var(--line);padding:48px 0 36px;font-size:14px}
.footer-grid{display:grid;gap:32px;grid-template-columns:2fr 1fr 1fr}
@media(max-width:720px){.footer-grid{grid-template-columns:1fr}}
.site-footer h4{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 12px}
.site-footer a{color:var(--ink)}
.site-footer a:hover{color:var(--accent)}
.site-footer .about{color:var(--muted);max-width:34ch;margin:10px 0 0}
.footer-links{display:flex;flex-direction:column;gap:8px}
.foot-bottom{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;
  color:var(--muted);font-size:13px;display:flex;justify-content:space-between;
  gap:12px;flex-wrap:wrap}

/* ── prose pages (about/faq/contact) ────────────────── */
.page-head{padding-top:64px;padding-bottom:40px;border-bottom:1px solid var(--line)}
.page-head h1{font-size:clamp(34px,5vw,48px);margin:8px 0 14px}
.page-head .lead{color:var(--muted);font-size:18px;max-width:60ch;margin:0}
.prose{padding-top:48px;padding-bottom:64px;max-width:720px}
.prose h2{font-size:24px;margin:44px 0 14px}
.prose h3{font-size:19px;margin:32px 0 10px}
.faq-item{border-top:1px solid var(--line);padding:22px 0}
.faq-item h3{font-size:17.5px;margin:0 0 8px;font-family:var(--sans);font-weight:600}
.faq-item p{color:var(--muted);margin:0}
.contact-card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:30px;margin-top:8px}
.contact-card a{font-size:17px;font-weight:600}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:14px 18px;border-radius:0 6px 6px 0;font-size:14.5px;color:var(--ink)}

/* ── library: login screen ─────────────────────────── */
#landing{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--bg)}
.login-box{max-width:400px;width:100%}
.login-box .brand{display:inline-block;margin-bottom:18px;font-size:22px}
.login-card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:30px}
.login-card h2{font-size:22px;margin:0 0 4px}
.login-card .hint{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.login-card label{display:block;font:600 12px var(--sans);letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
.login-card input{width:100%;background:var(--bg);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:6px;padding:11px 12px;
  font:15px var(--sans)}
.login-card input:focus{outline:none;border-color:var(--accent)}
#loginNote{color:var(--muted);font-size:12.5px;margin-top:12px}
.login-foot{margin-top:16px;font-size:13.5px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ── library: app ──────────────────────────────────── */
#app[hidden]{display:none}
.app-header{position:sticky;top:0;z-index:10;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 20px;display:flex;
  flex-wrap:wrap;gap:10px 16px;align-items:center}
.app-header .brand{font-size:18px}
#stats{color:var(--muted);font-size:13px;flex:1 1 200px;min-width:160px}
#search{background:var(--surface);border:1px solid var(--line-strong);
  border-radius:6px;padding:8px 12px;font:14px var(--sans);color:var(--ink);
  width:220px;max-width:100%}
#search:focus{outline:none;border-color:var(--accent)}
.btn-app{background:var(--surface);border:1px solid var(--line-strong);
  border-radius:6px;padding:8px 13px;font:500 13px var(--sans);cursor:pointer;
  color:var(--ink)}
.btn-app:hover{border-color:var(--accent);color:var(--accent)}
main#main{max-width:1280px;margin:0 auto;padding:24px 20px}
.app-footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px;
  border-top:1px solid var(--line);margin-top:20px}
.app-footer a{color:var(--accent)}
.banner{border:1px solid var(--line);background:var(--surface);
  border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
  padding:12px 16px;margin:0 0 18px;color:var(--muted);font-size:14px}
.banner b{color:var(--ink)}
.banner.error{border-left-color:#c0392b}
.banner a{color:var(--accent)}
section.batch{margin-bottom:30px}
.batch-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;
  margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.batch-head h2{font-family:var(--sans);font-size:17px;font-weight:600;margin:0}
.batch-head .tag{font:500 11px var(--mono);color:var(--accent);
  background:var(--surface);border:1px solid var(--line);padding:2px 8px;
  border-radius:20px}
.batch-head .when{color:var(--muted);font-size:13px}
.batch-head .tot{color:var(--muted);font-size:13px;margin-left:auto}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card video,.ph{width:100%;aspect-ratio:16/9;background:#efede9;display:block;
  object-fit:contain}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.ph svg{opacity:.5}
.ph .phsub{font-size:12px;opacity:.8}
.card .info{padding:12px 14px 6px;flex:1;min-width:0}
.card .title{font-size:14.5px;font-weight:600;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{color:var(--muted);font-size:12px;margin-top:4px;display:flex;
  flex-wrap:wrap;gap:4px 10px}
.card .badge{display:inline-block;font-size:11px;color:var(--muted);
  background:var(--bg);border:1px solid var(--line);border-radius:4px;
  padding:0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:bottom}
.card .actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px}
.card .actions a,.card .actions button{background:transparent;color:var(--ink);
  border:1px solid var(--line-strong);border-radius:6px;padding:6px 11px;
  font:500 12.5px var(--sans);cursor:pointer;text-decoration:none}
.card .actions a:hover,.card .actions button:hover{border-color:var(--accent);
  color:var(--accent)}
.card .actions .primary{background:var(--ink);border-color:var(--ink);
  color:#fff;font-weight:600}
.card .actions .primary:hover{background:#000;color:#fff}
.others summary{cursor:pointer;color:var(--muted);font-size:13px;margin:4px 0 14px}
.others ul{margin:6px 0 14px;padding-left:22px;color:var(--muted);font-size:13px}
.others a{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty h2{color:var(--ink)}
.skel{color:var(--muted);padding:40px;text-align:center}

/* ── library: player modal ─────────────────────────── */
#playerModal{position:fixed;inset:0;z-index:100;background:rgba(28,27,24,.55);
  display:flex;align-items:center;justify-content:center;padding:18px}
#playerModal[hidden]{display:none}
.modal-box{background:var(--surface);border:1px solid var(--line);
  border-radius:10px;width:min(960px,100%);max-height:calc(100vh - 36px);
  display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:1px solid var(--line)}
.modal-head .mtitle{flex:1;font:600 14px var(--sans);word-break:break-word;min-width:0}
#playerClose{background:transparent;border:1px solid var(--line-strong);
  border-radius:6px;padding:6px 12px;font:500 13px var(--sans);cursor:pointer;
  color:var(--ink)}
#playerClose:hover{border-color:#c0392b;color:#c0392b}
#playerStage{background:#000}
#playerStage video{width:100%;max-height:62vh;display:block}
#playerStatus{padding:14px 16px;border-top:1px solid var(--line)}
#playerMsg{font-size:14px;color:var(--muted);min-height:20px}
#playerMsg.done{color:var(--accent-dark)}
#playerMsg.err{color:#c0392b}
.pbar{height:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:4px;overflow:hidden;margin-top:10px}
.pbar[hidden]{display:none}
#pbarFill{height:100%;width:0%;background:var(--accent);transition:width .2s}
#playerAlt{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#playerAlt[hidden]{display:none}
#playerAlt a,#playerAlt button{background:transparent;color:var(--ink);
  border:1px solid var(--line-strong);border-radius:6px;padding:7px 12px;
  font:500 13px var(--sans);cursor:pointer;text-decoration:none}
#playerAlt a:hover,#playerAlt button:hover{border-color:var(--accent);color:var(--accent)}
#playerAlt .note{width:100%;color:var(--muted);font-size:12.5px}
#fileInput{display:none}
</style>
</head>

    <input id="search" type="search" placeholder="Search lessons…" autocomplete="off">

<!-- generated by the workflow: carries the unlock key (the site is free — no login) -->
<script src="auth.js"></script>
<!-- generated by the workflow: window.MEDIA_PROXY = "https://…workers.dev" (or null) -->
<script src="proxy.js"></script>
<!-- generated by the workflow: which GitHub repo to read releases from -->
<script src="site-config.js"></script>

<script>
"use strict";

/* ═══════════════ CONFIG ═══════════════
   The repo is found automatically, in this order:
     1. docs/site-config.js — generated by the workflow (works on ANY host:
        GitHub Pages, Vercel, Netlify, …). You normally don't touch this.
     2. The OWNER_OVERRIDE / REPO_OVERRIDE constants below.
     3. The OWNER.github.io/REPO URL when served from GitHub Pages.
   Only use the overrides if the files haven't been generated yet and you're
   hosting somewhere other than GitHub Pages. */
const OWNER_OVERRIDE = "auto";
const REPO_OVERRIDE  = "auto";

const VIDEO_EXT = ["webm", "mp4", "mov", "m4v", "mkv", "ogv"];
const MAX_PAGES = 10;          // releases pages à 100
const API = "https://api.github.com";

/* Must match KDF_ITER in .github/workflows/drive-to-webm.yml */
const KDF_ITER = 600000;

const PROXY = (typeof window.MEDIA_PROXY === "string" &&
               /^https:\/\//.test(window.MEDIA_PROXY))
              ? window.MEDIA_PROXY.replace(/\/+$/, "") : null;

/* ═══════════════ ACCESS — the library is free, no login ═══════════════
   auth.js (generated by the workflow) carries the unlock key. If the
   site hasn't been configured yet, the setup notice stays on screen. */

const DEMO_MODE = new URLSearchParams(location.search).get("demo") === "1";
const DEMO_AUTH = { configured: true, key: "demo:demo" };
const AUTH = DEMO_MODE ? DEMO_AUTH : (window.SITE_AUTH || { configured: false });

/* The "ID:PASSWORD" string. It derives the decryption key — kept in
   memory only; it comes straight from auth.js on every page load. */
let creds = (AUTH.configured && typeof AUTH.key === "string" && AUTH.key) || null;

let unlocked = false;
let siteNotice = null;   // persistent banner (e.g. manual-mode instructions)

function unlock() {
  unlocked = true;
  document.getElementById("landing").style.display = "none";
  document.getElementById("app").hidden = false;
  if (DEMO_MODE) {
    render(demoModel(), detectRepo(location), banner(
      "<b>Demo mode.</b> Showing sample data (?demo=1) — press Watch on " +
      "a lesson."));
  } else if (!PROXY) {
    siteNotice = banner(
      "<b>Watch offline.</b> Streaming isn't available on this site yet. To " +
      "watch: press <b>Download</b> on a card, then press <b>Watch</b> on the " +
      "same card and pick the downloaded file — it plays right there, and the " +
      "file never leaves your device.");
    load();
  } else {
    load();
  }
}


/* ═══════════════ CRYPTO (AES-256-CTR + PBKDF2, openssl-compatible) ═════ */

/* Decrypts an "openssl enc -aes-256-ctr -pbkdf2" file:
   bytes 0–7 "Salted__", bytes 8–15 salt, rest ciphertext.
   Key + IV = PBKDF2-SHA256(pass, salt, KDF_ITER) → 48 bytes. */
async function decryptEnc(buf, pass) {
  const u8 = new Uint8Array(buf);
  if (u8.length < 32 || String.fromCharCode.apply(null, u8.subarray(0, 8)) !== "Salted__") {
    throw new Error("not a lesson file");
  }
  const salt = u8.subarray(8, 16);
  const ct = u8.subarray(16);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass),
    "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: KDF_ITER, hash: "SHA-256" }, km, 384));
  const key = await crypto.subtle.importKey("raw", bits.subarray(0, 32),
    "AES-CTR", false, ["decrypt"]);
  return await crypto.subtle.decrypt(
    { name: "AES-CTR", counter: bits.subarray(32, 48), length: 64 }, key, ct);
}

function isWebM(buf) {
  const u8 = new Uint8Array(buf, 0, Math.min(4, buf.byteLength));
  return u8[0] === 0x1a && u8[1] === 0x45 && u8[2] === 0xdf && u8[3] === 0xa3;
}

const blobCache = new Map();   // cacheKey → { url, size } (max 3, LRU)

function cachePut(key, blob) {
  if (blobCache.has(key)) {
    const hit = blobCache.get(key);
    blobCache.delete(key); blobCache.set(key, hit);
    return hit.url;
  }
  const url = URL.createObjectURL(blob);
  blobCache.set(key, { url: url, size: blob.size });
  while (blobCache.size > 3) {
    const oldest = blobCache.keys().next().value;
    URL.revokeObjectURL(blobCache.get(oldest).url);
    blobCache.delete(oldest);
  }
  return url;
}

async function playFromBufferPromise(promise, asset) {
  setPct(0);
  setMsg("Opening… (this can take a moment)");
  try {
    const buf = await promise;
    if (!creds) { setMsg("This lesson can't be opened right now.", "err"); return; }
    const plain = await decryptEnc(buf, creds);
    if (!isWebM(plain)) {
      setMsg("This lesson couldn't be opened — the site was updated. Reload the page and try again.", "err");
      return;
    }
    const blob = new Blob([plain], { type: "video/webm" });
    const url = cachePut(asset.name + "|" + asset.browser_download_url, blob);
    playBlobUrl(url, asset);
  } catch (e) {
    setMsg("Couldn't open this file (" + e.message + ").", "err");
  }
}

async function fetchWithProgress(url, onPct) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const total = parseInt(res.headers.get("content-length") || "0", 10);
  if (!res.body || !total) return await res.arrayBuffer();
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  for (;;) {
    const r = await reader.read();
    if (r.done) break;
    chunks.push(r.value); got += r.value.length;
    if (total) onPct(Math.min(99, Math.round(got * 100 / total)));
  }
  const out = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  onPct(100);
  return out.buffer;
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}

async function watchAsset(asset) {
  modalAsset = asset;
  playerTitle.textContent = prettyTitle(asset.name);
  playerVideo.removeAttribute("src");
  playerVideo.style.display = "none";
  modal.hidden = false;
  playerAlt.hidden = true;
  playerAlt.textContent = "";

  if (!asset.enc) {                       // legacy unencrypted file — play directly
    setMsg("Playing.");
    playerVideo.src = asset.browser_download_url;
    playerVideo.style.display = "";
    playerVideo.play().catch(function () {});
    return;
  }

  const key = asset.name + "|" + asset.browser_download_url;
  if (blobCache.has(key)) {
    const hit = blobCache.get(key);
    blobCache.delete(key); blobCache.set(key, hit);
    offerManual(asset);
    playBlobUrl(hit.url, asset);
    return;
  }

  if (DEMO_MODE) {                        // demo bytes are embedded in this page
    playFromBufferPromise(Promise.resolve(b64ToBytes(DEMO_ENC)), asset);
    return;
  }

  if (!PROXY) {                           // manual mode: download → open
    setMsg("Streaming isn't available on this site right now.");
    offerManual(asset,
      "1) Download the lesson file above — 2) press “Open the downloaded file…” and pick it. " +
      "It plays right there.");
    return;
  }

  offerManual(asset);                     // streaming, with manual as fallback
  setMsg("Downloading the lesson file…");
  try {
    const buf = await fetchWithProgress(
      PROXY + "?url=" + encodeURIComponent(asset.browser_download_url),
      function (p) { setMsg("Downloading the lesson file… " + p + "%"); setPct(p); });
    playFromBufferPromise(Promise.resolve(buf), asset);
  } catch (e) {
    setPct(0);
    setMsg("Couldn't fetch the lesson file. " +
      "You can still download it above and open it locally.", "err");
  }
}

/* ═══════════════ PURE HELPERS (unit-tested) ═══════════════ */

function detectRepo(loc) {
  /* 1 — workflow-generated site-config.js (present on any host) */
  if (typeof window.SITE_REPO === "object" && window.SITE_REPO &&
      window.SITE_REPO.owner && window.SITE_REPO.repo) {
    return { owner: window.SITE_REPO.owner, repo: window.SITE_REPO.repo };
  }
  /* 2 — manual overrides */
  if (OWNER_OVERRIDE !== "auto" && REPO_OVERRIDE !== "auto") {
    return { owner: OWNER_OVERRIDE, repo: REPO_OVERRIDE };
  }
  /* 3 — auto-detect from the github.io URL */
  const m = String(loc.hostname || "").match(/^([^.]+)\.github\.io$/i);
  if (m && m[1].toLowerCase() !== "pages") {
    const repo = (loc.pathname || "/").split("/")[1];
    if (repo) return { owner: m[1], repo: decodeURIComponent(repo).replace(/\.html$/, "").replace(/\/$/, "") };
  }
  return null;
}

function formatBytes(n) {
  if (!isFinite(n) || n <= 0) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
  return (n / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + " " + u[i];
}

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

/* Release asset names carry the folder prefix: "Folder__file.webm.enc" */
function splitAssetName(name) {
  const i = name.lastIndexOf("__");
  if (i > 0 && i < name.length - 2) return { folder: name.slice(0, i), title: name.slice(i + 2) };
  return { folder: "", title: name };
}

function isEncryptedName(name) {
  return /\.webm\.enc$/i.test(name || "");
}

function prettyTitle(name) {
  const parts = splitAssetName(name);
  return parts.title.replace(/\.webm\.enc$/i, "").replace(/\.[a-z0-9]{2,4}$/i, "");
}

function buildModel(releases) {
  const sections = [];
  for (const r of releases) {
    const assets = (r.assets || []).filter(function (a) { return a.state !== "draft"; });
    if (!assets.length) continue;
    const videos = [], others = [];
    for (const a of assets) {
      const name = a.name || "";
      if (isEncryptedName(name)) {
        a.enc = true;
        videos.push(a);
      } else {
        const ext = (name.split(".").pop() || "").toLowerCase();
        if (VIDEO_EXT.indexOf(ext) >= 0) {
          a.enc = false;
          videos.push(a);
        } else {
          others.push(a);
        }
      }
    }
    if (!videos.length) continue;
    videos.sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); });
    const total = videos.reduce(function (s, a) { return s + (a.size || 0); }, 0);
    sections.push({
      tag: r.tag_name || "",
      title: r.name || r.tag_name || "Release",
      date: r.created_at || "",
      videos: videos,
      others: others,
      total: total
    });
  }
  sections.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
  return sections;
}

      .catch(function () { window.prompt("Copy this link:", asset.browser_download_url); });

function render(model, repo, notice) {
  if (model) currentModel = model;

  const nVideos = (model || currentModel).reduce(function (s, sec) { return s + sec.videos.length; }, 0);
  const nBytes = (model || currentModel).reduce(function (s, sec) { return s + sec.total; }, 0);
  stats.textContent = nVideos
    ? nVideos + " lessons · " + formatBytes(nBytes) + " · " + (model || currentModel).length + " batch" + ((model || currentModel).length > 1 ? "es" : "")
    : "no lessons yet";

  const rel = el("releases-link");
  rel.href = repo ? "https://github.com/" + repo.owner + "/" + repo.repo + "/releases" : "#";

  main.textContent = "";
  if (siteNotice) main.appendChild(siteNotice);
  if (notice) main.appendChild(notice);

  if (!currentModel.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = "<h2>Nothing here yet</h2>" +
      "<p>New lessons appear here as they're published.</p>";
    main.appendChild(empty);
    return;
  }

  for (const sec of currentModel) {
    const section = document.createElement("section");
    section.className = "batch";
    section.setAttribute("data-tag", sec.tag);

    const head = document.createElement("div");
    head.className = "batch-head";
    head.innerHTML =
      "<h2></h2> <span class='tag'></span> <span class='when'></span>" +
      "<span class='tot'>" + sec.videos.length + " lessons · " + formatBytes(sec.total) + "</span>";
    head.querySelector("h2").textContent = sec.title;
    head.querySelector(".tag").textContent = sec.tag;
    head.querySelector(".when").textContent = formatDate(sec.date);

    const grid = document.createElement("div");
    grid.className = "grid";
    for (const a of sec.videos) grid.appendChild(videoCard(a));

    section.appendChild(head);
    section.appendChild(grid);

    if (sec.others.length) {
      const det = document.createElement("details");
      det.className = "others";
      const s = document.createElement("summary");
      s.textContent = "+" + sec.others.length + " other file" + (sec.others.length > 1 ? "s" : "");
      const ul = document.createElement("ul");
      for (const o of sec.others) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = o.browser_download_url;
        a.textContent = o.name;
        li.appendChild(a);
        li.appendChild(document.createTextNode(" (" + formatBytes(o.size) + ")"));
        ul.appendChild(li);
      }
      det.appendChild(s);
      det.appendChild(ul);
      section.appendChild(det);
    }
    main.appendChild(section);
  }
  applyFilter();
}

function applyFilter() {
  const q = searchBox.value.trim().toLowerCase();
  let visible = 0;
  const sections = main.querySelectorAll("section.batch");
  sections.forEach(function (sec) {
    let shown = 0;
    sec.querySelectorAll(".card").forEach(function (card) {
      const hit = !q || card.getAttribute("data-search").indexOf(q) >= 0;
      card.style.display = hit ? "" : "none";
      if (hit) shown++;
    });
    sec.style.display = shown ? "" : "none";
    visible += shown;
  });
  if (sections.length) {
    stats.textContent = visible + " of " +
      currentModel.reduce(function (s, x) { return s + x.videos.length; }, 0) +
      " lessons shown";
  }
}

/* ═══════════════ DATA LOADING ═══════════════ */

async function fetchReleases(repo) {
  const all = [];
  /* The release list is read through the media proxy when one is deployed
     (mandatory for private repos — GitHub 404s anonymous reads there), and
     straight from the API otherwise. */
  for (let page = 1; page <= MAX_PAGES; page++) {
    const res = await fetch(PROXY
      ? PROXY + "/releases?per_page=100&page=" + page
      : API + "/repos/" + repo.owner + "/" + repo.repo +
        "/releases?per_page=100&page=" + page,
      { headers: { Accept: "application/vnd.github+json" } });
    if (res.status === 404) throw new Error("notfound");
    if (res.status === 403 || res.status === 429) {
      if (res.headers.get("x-ratelimit-remaining") === "0") throw new Error("ratelimit");
      throw new Error("notfound");
    }
    if (!res.ok) throw new Error("http " + res.status);
    const data = await res.json();
    all.push.apply(all, data);
    if (data.length < 100) break;
  }
  return all;
}

async function load() {
  const repo = detectRepo(location);
  if (!repo) {
    render(demoModel(), null, banner(
      "<b>Preview.</b> Showing sample data — no lesson library is connected on " +
      "this address yet."));
    return;
  }
  main.innerHTML = "<div class='skel'>Loading lessons…</div>";
  try {
    const releases = await fetchReleases(repo);
    render(buildModel(releases), repo);
  } catch (e) {
    let msg;
    if (e.message === "ratelimit") {
      msg = "<b>Too many requests from your network.</b> Wait a bit and hit Refresh.";
    } else if (e.message === "notfound") {
      msg = "<b>The lesson list couldn't load.</b> Hit Refresh to try again.";
    } else {
      msg = "<b>Couldn't load the lessons.</b> Check your connection and hit Refresh.";
    }
    render(demoModel(), repo, banner(msg + " Showing demo data below.", true));
  }
}

/* A real 2-second WebM clip, AES-256 encrypted with the demo credentials
